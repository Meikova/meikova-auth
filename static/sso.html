<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Meikova ID — Cổng Xác Thực Tập Trung</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #070D17;
      --card-bg: #0B1220;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-focus: rgba(56, 189, 248, 0.4);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-hover: #0284C7;
      --success: #10B981;
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.3);
      --item-hover: rgba(255, 255, 255, 0.05);
      --radius: 12px;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    /* Zero-Native-Scrollbars: 5px thin, rounded, transparent track, neon hover */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Guarantee zero window scrollbars */
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -10%;
      left: 15%;
      width: 70vw;
      height: 50vh;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.07) 0%, rgba(7, 13, 23, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 100vh;
      padding: 14px 18px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--card-bg);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(16, 185, 129, 0.06));
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .brand-logo svg {
      width: 18px;
      height: 18px;
      color: var(--accent);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .client-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      padding: 1px 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .client-badge svg {
      width: 10px;
      height: 10px;
      color: var(--accent);
    }

    /* Main Content Area */
    .view-deck {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .auth-view {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Tabs */
    .tab-deck {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 2px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 5px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* Alerts */
    .banner {
      display: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      margin-bottom: 8px;
      align-items: center;
      gap: 7px;
      line-height: 1.3;
    }

    .banner.error {
      display: flex;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #FCA5A5;
    }

    .banner.success {
      display: flex;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
    }

    .banner svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* Forms */
    .form-group {
      margin-bottom: 7px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 35px;
      background: rgba(7, 13, 23, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0 9px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 12.5px;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 14px -2px var(--accent-glow);
    }

    /* Zero-Autofill-Override */
    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover, 
    .form-input:-webkit-autofill:focus, 
    .form-input:-webkit-autofill:active {
      -webkit-text-fill-color: var(--text) !important;
      caret-color: var(--accent) !important;
      -webkit-box-shadow: 0 0 0 1000px #070D17 inset !important;
      box-shadow: 0 0 0 1000px #070D17 inset !important;
      transition: background-color 50000s ease-in-out 0s !important;
      border-color: var(--card-border) !important;
    }

    .form-input:-webkit-autofill:focus {
      border-color: var(--accent) !important;
      -webkit-box-shadow: 0 0 0 1000px #070D17 inset, 0 0 0 1px var(--accent), 0 0 14px -2px var(--accent-glow) !important;
      box-shadow: 0 0 0 1000px #070D17 inset, 0 0 0 1px var(--accent), 0 0 14px -2px var(--accent-glow) !important;
    }

    .form-input::placeholder {
      color: var(--text-dim);
    }

    .btn-submit {
      width: 100%;
      height: 36px;
      background: var(--accent);
      color: #070D17;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease;
      margin-top: 5px;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      color: #FFFFFF;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 8px 0;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    .divider span {
      padding: 0 8px;
    }

    /* Google Button Wrapper */
    .google-btn-wrap {
      display: flex;
      justify-content: center;
    }

    /* =========================================
       ACCOUNT CHOOSER VIEW STYLES
       ========================================= */
    .account-chooser-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .account-chooser-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .accounts-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 8px;
    }

    .account-card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .account-card:hover {
      background: var(--item-hover);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 10px -2px rgba(56, 189, 248, 0.15);
    }

    .account-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #FFFFFF;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-transform: uppercase;
    }

    .account-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .account-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .account-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    .account-sub {
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
      margin-top: 1px;
    }

    .account-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-action-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action-icon:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.25);
      color: #F87171;
    }

    .btn-action-icon svg {
      width: 12px;
      height: 12px;
    }

    .btn-arrow-enter {
      color: var(--accent);
      opacity: 0.7;
    }

    .account-card:hover .btn-arrow-enter {
      opacity: 1;
      transform: translateX(2px);
    }

    .btn-secondary-action {
      width: 100%;
      height: 34px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 4px;
    }

    .btn-secondary-action:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-back-to-accounts {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 6px;
      padding: 0;
      transition: color 0.15s ease;
    }

    .btn-back-to-accounts:hover {
      color: var(--accent);
    }

    .btn-back-to-accounts svg {
      width: 11px;
      height: 11px;
    }

    /* Footer Note */
    .card-footer {
      text-align: center;
      flex-shrink: 0;
      padding-top: 6px;
      font-size: 10.5px;
      color: var(--text-dim);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(7, 13, 23, 0.3);
      border-top-color: #070D17;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1 class="brand-title">Meikova ID</h1>
      <p class="brand-subtitle" id="portalSubtitle">Cổng xác thực tập trung cho toàn hệ sinh thái</p>
      <div class="client-badge" id="clientBadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="m10 15 5-3-5-3v6z"/>
        </svg>
        <span id="clientName">Universal SSO</span>
      </div>
    </div>

    <!-- Feedback Banners -->
    <div class="banner error" id="alertError">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMessage">Thông tin xác thực không chính xác</span>
    </div>

    <div class="banner success" id="alertSuccess">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span id="successMessage">Đăng nhập thành công. Đang chuyển tiếp...</span>
    </div>

    <!-- Main Views Deck -->
    <div class="view-deck">

      <!-- =====================================
           VIEW 1: ACCOUNT CHOOSER (SAVED SESSIONS)
           ===================================== -->
      <div class="auth-view hidden" id="viewAccountChooser">
        <div class="account-chooser-header">
          <span class="account-chooser-title">Chọn tài khoản đã lưu</span>
          <span class="account-chooser-title" id="accountCount">0 tài khoản</span>
        </div>

        <div class="accounts-list" id="accountListContainer">
          <!-- Dynamic Account Items Injected by JS -->
        </div>

        <button type="button" class="btn-secondary-action" id="btnUseOtherAccount" onclick="showAuthForm('login')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Sử dụng tài khoản khác</span>
        </button>
      </div>

      <!-- =====================================
           VIEW 2: STANDARD LOGIN / REGISTER FORM
           ===================================== -->
      <div class="auth-view" id="viewAuthForm">
        <!-- Back to Chooser button (shown only if saved accounts exist) -->
        <button type="button" class="btn-back-to-accounts hidden" id="btnBackToAccounts" onclick="renderView()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>Quay lại danh sách tài khoản</span>
        </button>

        <div class="tab-deck">
          <button class="tab-btn active" id="tabLogin" onclick="switchMode('login')">Đăng nhập</button>
          <button class="tab-btn" id="tabRegister" onclick="switchMode('register')">Tạo tài khoản</button>
        </div>

        <!-- Login Form -->
        <form id="formLogin" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginUser">Tên đăng nhập hoặc Email</label>
            <div class="input-wrap">
              <input class="form-input" id="loginUser" type="text" placeholder="username hoặc email@meikova.io" required autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPass">Mật khẩu</label>
            <div class="input-wrap">
              <input class="form-input" id="loginPass" type="password" placeholder="Tối thiểu 6 ký tự" required autocomplete="current-password">
            </div>
          </div>
          <button class="btn-submit" id="btnLoginSubmit" type="submit">
            <span>Xác nhận Đăng nhập</span>
          </button>
        </form>

        <!-- Register Form -->
        <form id="formRegister" class="hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="regUser">Tên đăng nhập</label>
            <div class="input-wrap">
              <input class="form-input" id="regUser" type="text" placeholder="Chữ thường, số, gạch dưới" required autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">Email (tùy chọn)</label>
            <div class="input-wrap">
              <input class="form-input" id="regEmail" type="email" placeholder="name@example.com" autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regName">Tên hiển thị</label>
            <div class="input-wrap">
              <input class="form-input" id="regName" type="text" placeholder="Ví dụ: Nguyễn Văn A">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPass">Mật khẩu</label>
            <div class="input-wrap">
              <input class="form-input" id="regPass" type="password" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
            </div>
          </div>
          <button class="btn-submit" id="btnRegSubmit" type="submit">
            <span>Tạo tài khoản Meikova ID</span>
          </button>
        </form>

        <div class="divider">
          <span>Hoặc tiếp tục với</span>
        </div>

        <div class="google-btn-wrap">
          <div id="g_id_onload"
               data-client_id="515668723869-5g65hqgjvubafrqjcgdlb4jbsjcbe531.apps.googleusercontent.com"
               data-callback="handleGoogleCredential"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-size="medium"
               data-theme="filled_black"
               data-text="continue_with"
               data-shape="pill"
               data-logo_alignment="left"
               data-width="260">
          </div>
        </div>
      </div>

    </div>

    <!-- Footer Note -->
    <div class="card-footer">
      Mã hóa bất đối xứng Ed25519 &bull; Zero-Roundtrip SSO &bull; Turso Cloud
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('client_id') || params.get('app') || 'meikova-platform';
    const targetOrigin = params.get('origin') || '*';
    const redirectUri = params.get('redirect_uri') || '';
    const initialMode = params.get('mode') || (window.location.pathname.includes('register') ? 'register' : 'login');
    const forceNewLogin = params.get('force_login') === 'true' || params.get('new') === 'true';

    // Update Client Badge
    const clientMap = {
      'harvest': 'Meikova Harvest',
      'meikova-harvest': 'Meikova Harvest',
      'loop': 'Meikova Loop',
      'meikova-loop': 'Meikova Loop',
      'relay': 'Meikova Relay',
      'meikova-relay': 'Meikova Relay'
    };
    if (clientMap[clientId]) {
      document.getElementById('clientName').textContent = clientMap[clientId];
    }

    // =========================================
    // MULTI-ACCOUNT STORAGE ENGINE
    // =========================================
    const STORAGE_KEY = 'meikova_saved_accounts';

    const AccountStore = {
      getAll() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const list = JSON.parse(raw);
          return Array.isArray(list) ? list.sort((a, b) => (b.last_used || 0) - (a.last_used || 0)) : [];
        } catch (e) {
          return [];
        }
      },

      save(user, token, provider = 'password') {
        try {
          let list = this.getAll();
          const identifier = (user.id || user.username || '').toLowerCase();
          list = list.filter(item => {
            const itemId = (item.id || item.username || '').toLowerCase();
            return itemId !== identifier;
          });

          const account = {
            id: user.id || 'usr_' + Date.now(),
            username: user.username || '',
            display_name: user.display_name || user.name || user.username || 'Thành viên Meikova',
            email: user.email || '',
            avatar_url: user.avatar_url || user.picture || null,
            token: token || null,
            provider: provider,
            last_used: Date.now()
          };

          list.unshift(account);
          if (list.length > 8) list = list.slice(0, 8); // Keep max 8 accounts
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        } catch (e) {
          console.warn('Failed to save account to localStorage:', e);
        }
      },

      remove(id) {
        try {
          let list = this.getAll();
          list = list.filter(item => item.id !== id && item.username !== id);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          return list;
        } catch (e) {
          return [];
        }
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getMonogram(name, username) {
      const src = (name || username || 'M').trim();
      const parts = src.split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return src.slice(0, 2).toUpperCase();
    }

    // =========================================
    // VIEW ROUTING & RENDERING
    // =========================================
    function renderView() {
      hideAlerts();
      const accounts = AccountStore.getAll();
      const viewChooser = document.getElementById('viewAccountChooser');
      const viewAuth = document.getElementById('viewAuthForm');
      const btnBack = document.getElementById('btnBackToAccounts');

      if (accounts.length > 0 && !forceNewLogin) {
        // Show Account Chooser View
        viewChooser.classList.remove('hidden');
        viewAuth.classList.add('hidden');
        btnBack.classList.remove('hidden');
        document.getElementById('portalSubtitle').textContent = 'Chọn tài khoản để tiếp tục đăng nhập';
        renderAccountList(accounts);
      } else {
        // Show Standard Login Form View
        viewChooser.classList.add('hidden');
        viewAuth.classList.remove('hidden');
        if (accounts.length > 0) {
          btnBack.classList.remove('hidden');
        } else {
          btnBack.classList.add('hidden');
        }
        document.getElementById('portalSubtitle').textContent = 'Cổng xác thực tập trung cho toàn hệ sinh thái';
        switchMode(initialMode);
      }
    }

    function showAuthForm(mode = 'login') {
      document.getElementById('viewAccountChooser').classList.add('hidden');
      document.getElementById('viewAuthForm').classList.remove('hidden');
      const accounts = AccountStore.getAll();
      if (accounts.length > 0) {
        document.getElementById('btnBackToAccounts').classList.remove('hidden');
      }
      document.getElementById('portalSubtitle').textContent = 'Cổng xác thực tập trung cho toàn hệ sinh thái';
      switchMode(mode);
    }

    function renderAccountList(accounts) {
      const container = document.getElementById('accountListContainer');
      document.getElementById('accountCount').textContent = `${accounts.length} tài khoản`;
      container.innerHTML = '';

      accounts.forEach(acc => {
        const item = document.createElement('div');
        item.className = 'account-card';
        item.onclick = () => selectAccount(acc);

        const monogram = getMonogram(acc.display_name, acc.username);
        const avatarHtml = acc.avatar_url
          ? `<div class="account-avatar"><img src="${escapeHtml(acc.avatar_url)}" alt=""></div>`
          : `<div class="account-avatar">${escapeHtml(monogram)}</div>`;

        item.innerHTML = `
          ${avatarHtml}
          <div class="account-info">
            <span class="account-name">${escapeHtml(acc.display_name || acc.username)}</span>
            <span class="account-sub">${escapeHtml(acc.email || '@' + acc.username)}</span>
          </div>
          <div class="account-actions">
            <button type="button" class="btn-action-icon btn-remove-acc" title="Xóa tài khoản khỏi thiết bị này" aria-label="Xóa" onclick="event.stopPropagation(); removeAccount('${escapeHtml(acc.id)}');">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
            <div class="btn-action-icon btn-arrow-enter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function removeAccount(accountId) {
      const updated = AccountStore.remove(accountId);
      showSuccess('Đã xóa phiên tài khoản khỏi thiết bị.');
      setTimeout(() => {
        hideAlerts();
        if (updated.length === 0) {
          showAuthForm('login');
        } else {
          renderAccountList(updated);
        }
      }, 400);
    }

    async function selectAccount(acc) {
      hideAlerts();
      if (!acc.token) {
        // Fallback: prompt for password
        prefillAndAskPassword(acc);
        return;
      }

      // 1. Verify token payload expiration client-side
      try {
        const parts = acc.token.split('.');
        if (parts.length === 3) {
          const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
          if (payload.exp && payload.exp < (Date.now() / 1000)) {
            prefillAndAskPassword(acc, 'Phiên đăng nhập đã hết hạn. Vui lòng nhập mật khẩu.');
            return;
          }
        }
      } catch (e) {
        // Fallback to server validation if token parsing fails
      }

      // 2. Token is fresh: execute 1-Click Fast SSO
      showSuccess(`Đang đăng nhập bằng ${acc.display_name || acc.username}...`);
      AccountStore.save(acc, acc.token, acc.provider);
      setTimeout(() => {
        dispatchAuthSuccess({
          token: acc.token,
          user: {
            id: acc.id,
            username: acc.username,
            email: acc.email,
            display_name: acc.display_name,
            avatar_url: acc.avatar_url
          }
        });
      }, 250);
    }

    function prefillAndAskPassword(acc, message = '') {
      showAuthForm('login');
      document.getElementById('loginUser').value = acc.username || acc.email || '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
      if (message) {
        showError(message);
      }
    }

    function switchMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('formLogin').classList.toggle('hidden', !isLogin);
      document.getElementById('formRegister').classList.toggle('hidden', isLogin);
      hideAlerts();
    }

    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      document.getElementById('alertError').style.display = 'flex';
      document.getElementById('alertSuccess').style.display = 'none';
    }

    function showSuccess(msg) {
      document.getElementById('successMessage').textContent = msg;
      document.getElementById('alertSuccess').style.display = 'flex';
      document.getElementById('alertError').style.display = 'none';
    }

    function hideAlerts() {
      document.getElementById('alertError').style.display = 'none';
      document.getElementById('alertSuccess').style.display = 'none';
    }

    function dispatchAuthSuccess(authResult) {
      showSuccess('Xác thực thành công. Đang đồng bộ phiên...');
      const token = authResult.token;
      const user = authResult.user;

      // Save to AccountStore for future 1-Click fast login
      AccountStore.save(user, token);

      // 1. PostMessage to Parent Window / Opener (for Popup SSO)
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'MEIKOVA_SSO_SUCCESS',
            token: token,
            user: user,
            client_id: clientId
          }, targetOrigin === '*' ? '*' : targetOrigin);
        } catch (e) {
          console.warn('postMessage failed:', e);
        }
        setTimeout(() => {
          window.close();
        }, 500);
        return;
      }

      // 2. Redirect URL (for Desktop Callback or Direct Web Redirect)
      if (redirectUri) {
        const hash = `#token=${encodeURIComponent(token)}&user_id=${encodeURIComponent(user.id)}&username=${encodeURIComponent(user.username)}`;
        window.location.href = redirectUri + hash;
        return;
      }

      // 3. Standalone mode: Redirect to profile/me
      setTimeout(() => {
        window.location.href = '/api/auth/me';
      }, 700);
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlerts();
      const btn = document.getElementById('btnLoginSubmit');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Đang kiểm thực...</span>';

      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'ok') {
          showError(data.detail || data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác.');
          btn.disabled = false;
          btn.innerHTML = '<span>Xác nhận Đăng nhập</span>';
          return;
        }
        dispatchAuthSuccess(data);
      } catch (err) {
        showError('Không thể kết nối Cổng xác thực. Vui lòng thử lại.');
        btn.disabled = false;
        btn.innerHTML = '<span>Xác nhận Đăng nhập</span>';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlerts();
      const btn = document.getElementById('btnRegSubmit');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Đang tạo tài khoản...</span>';

      const username = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim() || null;
      const display_name = document.getElementById('regName').value.trim() || null;
      const password = document.getElementById('regPass').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email, display_name })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'ok') {
          showError(data.detail || data.message || 'Không thể tạo tài khoản.');
          btn.disabled = false;
          btn.innerHTML = '<span>Tạo tài khoản Meikova ID</span>';
          return;
        }
        dispatchAuthSuccess(data);
      } catch (err) {
        showError('Không thể kết nối Cổng xác thực. Vui lòng thử lại.');
        btn.disabled = false;
        btn.innerHTML = '<span>Tạo tài khoản Meikova ID</span>';
      }
    }

    async function handleGoogleCredential(response) {
      hideAlerts();
      if (!response.credential) {
        showError('Google token không hợp lệ.');
        return;
      }
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'ok') {
          showError(data.detail || 'Xác thực Google thất bại.');
          return;
        }
        dispatchAuthSuccess(data);
      } catch (err) {
        showError('Lỗi kết nối tới máy chủ xác thực Google.');
      }
    }

    // Initial View Mount
    renderView();
  </script>
</body>
